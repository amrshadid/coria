name: Checks

# Every pull request, whatever branch it targets, and every push to the two
# branches that keep history. A feature branch is checked by its pull request,
# so a push to one does not run this twice.
on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

# A new push to a pull request makes the run for the previous one worthless;
# cancel it rather than spend the private repository's minutes finishing it.
# Pushes to develop and main are never cancelled, so each merge is checked.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# bash named explicitly, on every system, so GitHub runs each script with
# "bash -eo pipefail": a command that fails inside a pipe, such as make size
# piped to tee below, then fails its step instead of being hidden by the last
# command of the pipe. Without it the default shell runs without pipefail.
defaults:
  run:
    shell: bash

# Each step runs a Makefile target, the same command a person runs locally, so
# CI and a laptop cannot disagree about what a gate is.
#
# Actions are pinned to a commit, with the release in the comment: a tag can be
# moved to other code, a commit cannot.
jobs:
  linux:
    name: Linux - Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    # A run that hangs is stopped long before GitHub's six hours: these jobs
    # take about two minutes, and every minute counts against the allowance.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # check-latest takes the newest patch release rather than whatever the
      # runner image has cached: govulncheck reports the standard library of
      # the Go that runs it, so an old patch would fail it for nothing here.
      # No module cache: the module has two small dependencies, which
      # download in seconds.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: false

      - name: Go version
        run: go version

      - name: gofmt -s
        run: make fmt

      - name: go vet, amd64 and 386
        run: make vet

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Keep in step with GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.15.0
          install-only: true

      - name: golangci-lint
        run: make lint GOLANGCI_LINT=golangci-lint

      - name: govulncheck
        run: make vuln

      - name: go test -race
        run: make test

      # The sealed-secret format checked against another implementation:
      # Python's cryptography package and what it pulls in, at exact versions
      # with their hashes, so a changed file on the package index is refused.
      # In a virtual environment because the runner's system Python refuses
      # pip installs (PEP 668).
      - name: Outside check, sealing against Python cryptography
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes -r scripts/requirements-check-seal.txt
          "$RUNNER_TEMP/venv/bin/python" -c 'import cryptography; print("cryptography", cryptography.__version__)'
          make check-seal PYTHON="$RUNNER_TEMP/venv/bin/python"

      # The tests as 32-bit binaries, which an x86-64 Linux runs natively:
      # int is 32 bits there and the SQLite library is translated for it.
      # One Go only, to spend fewer minutes.
      - name: go test, linux/386
        if: matrix.go == '1.27'
        run: make test-386

      # The SQLite master database read back by SQLite's own command line
      # tool: tables, rows, integrity and foreign key checks, and a dump
      # searched for the sample key's secret (absent) and hash (present).
      - name: Outside check, the SQLite master read by sqlite3
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends sqlite3 > /dev/null
          make check-master-sqlite

      # Each fuzz target for ten seconds, on one Go only: the inputs it finds
      # do not depend on the Go release, and the minutes are limited.
      - name: Fuzzing, 10 seconds a target
        if: matrix.go == '1.27'
        run: make fuzz FUZZTIME=10s

      - name: Static builds
        run: make build

      # The size is written to the job summary so a pull request that makes the
      # binary much larger shows it without anyone opening the log. pipefail
      # (see defaults) makes a failing make size fail this step despite tee.
      - name: Binary sizes
        run: |
          {
            echo "### Binary sizes, Go ${{ matrix.go }}"
            echo
            make --no-print-directory size
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Each binary was built with CGO_ENABLED=0; this shows the Linux one is
      # in fact static, so a change that brings in C cannot pass unseen.
      - name: The linux/amd64 binary is static
        # grep without -q: it reads all its input, so the command before it is
        # never cut off by a closed pipe, which pipefail would report as a
        # failure.
        run: |
          file bin/magnetar-linux-amd64 | grep 'statically linked'
          go version -m bin/magnetar-linux-amd64 | grep -x $'\tbuild\tCGO_ENABLED=0'
          ./bin/magnetar-linux-amd64 version

  # Windows has its own paths, line endings and executables, so the tests run
  # there on every pull request. The newest Go only: Windows minutes count
  # double against a private repository, and the older Go is tested on Linux.
  windows:
    name: Windows - Go 1.27
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
          cache: false

      - name: Go version
        run: go version

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -v ./...

  # macOS only after a merge: a macOS minute counts as ten against a private
  # repository, and the work is done on macOS, where the tests run before every
  # pull request. When the repository is public this joins the pull requests.
  macos:
    name: macOS - Go 1.27
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
          cache: false

      - name: Go version
        run: go version

      - name: go test
        run: go test -v ./...

  # The API contract in api/proto: buf lint, the breaking-change check against
  # the base, the check that the committed gen/ is what the proto files
  # generate, and a second toolchain (Python's grpcio-tools) compiling the same
  # files. Linux only: none of it depends on the system.
  contract:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The whole history, so the breaking check can read its base. The
      # checkout keeps no credentials, so a later git fetch of the private
      # repository would be refused; the checkout's own fetch is the only one.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Go builds the two protoc plugins and runs nothing else here. buf is
      # not built: make downloads its release binary and checks it against
      # the SHA-256 in scripts/buf.sha256 (scripts/install-buf.sh).
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
          cache: false

      - name: buf lint
        run: make proto-lint

      # The base is the pull request's target branch, or the commit a push
      # replaced. After a force push that commit may be in no branch and so
      # not in the clone; the check then compares with the pushed commit's
      # parent and says so. A push that made a branch has no commit before it
      # and is not compared.
      - name: buf breaking
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            make proto-breaking PROTO_BASE="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            if git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
              make proto-breaking PROTO_BASE="$BEFORE"
            else
              echo "proto-breaking: $BEFORE, the commit before this push, is not in the clone (a force push?); comparing with HEAD^ instead"
              make proto-breaking PROTO_BASE=HEAD^
            fi
          else
            echo "proto-breaking: skipped, this push has no commit before it to compare with"
          fi

      - name: gen/ is current
        run: make proto-check

      - name: Python grpcio-tools compiles the contract
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check -r scripts/requirements-proto.txt
          make proto-python PYTHON="$RUNNER_TEMP/venv/bin/python"
