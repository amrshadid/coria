syntax = "proto3";

// Package coria.v1: what holds for the whole package (callers, roles, error
// kinds, limits, paging, secrets, partial updates) is said on the package in
// access.proto.
package coria.v1;

import "google/protobuf/timestamp.proto";

// JobService makes, reads, cancels and retries a tenant's jobs. A job is a
// piece of work a person or a rule asks for, kept in the tenant's database
// until it ends, so it survives a restart of the server midway and goes on
// from where it was. A job has a kind; this version has one, send: the
// archived instances of a subject, a session or a scan sent to one of the
// tenant's senders (SenderService). A kind added later is a new member of
// Job's kind, served by these same methods.
//
// What a send job sends. The instances the catalog held for its target when
// the job was made: each instance archived at or before the job's
// create_time. An instance archived later into the same session is sent by
// its own forward or by a new job, never by this one. An archive that began
// before create_time and ended after the job listed its scan is the job's
// all the same: it is sent, and the counts grow by it when it is. A job
// made by a receiver's forward_to (Receiver) sends exactly the instances
// one reception archived, and names that reception and its receiver; the
// server makes one such job per sender the receiver names when the
// reception reaches done, in the same transaction, and never two for the
// same reception and sender, so a step run again makes nothing twice.
// Forwarding never delays a reception or changes how it ends.
//
// How a send job runs. Its work is one unit per scan of its target, each
// sending the scan's instances in the catalog's order on one association
// (for a stow sender, a series of requests). A unit records how far the
// peer has answered, in batches of at most 64 instances or one second; a
// unit taken over after a crash or a lost lease goes on after the last
// instance recorded. So a send is at least once: an instance the job counts
// as sent was answered by the peer, and after a crash at most the instances
// answered since the last record, one batch per unit, are sent again. An
// instance a stow peer leaves unaccounted does not hold the record back:
// the unit moves past it and keeps it owed, tries it once more by name, and
// only then refuses it as JOB_FAILURE_CODE_PEER_UNACCOUNTED; a crash in
// between still sends at most one batch again. Every peer seen treats the
// same SOP Instance UID with the same bytes as a repeat; a peer that keeps
// both copies would keep both.
//
// What the peer's answer means, for each instance. A DIMSE sender reads the
// C-STORE response's status (PS3.4 B.2.3, PS3.7 Annex C): 0000 is sent;
// B000, B006 and B007 (coerced, elements discarded, data set does not match
// its SOP class) are sent with a warning, counted apart, because the peer
// changed what it keeps; A7xx (out of resources) is a temporary failure of
// the unit, which keeps its place and is tried again later; any other
// status, A9xx, Cxxx, 0122 (SOP class not supported) and 0124 (not
// authorized) among them, refuses the instance, which is listed with its
// status (ListJobFailures), and the unit goes on. A stow sender reads the
// answer as StowSender says. A connection that fails, an association that
// is aborted, a timeout, or a stow request answered 408, 429 or a 5xx, is a
// temporary failure of the unit.
//
// Attempts. A unit that fails for a temporary cause is tried again after a
// wait that doubles from 10 seconds to an hour; it has 30 attempts, about a
// day at the longest wait. While its sender is down or disabled, no attempt
// is made and none is used, so a peer down overnight does not fail a job. A
// unit whose attempts run out ends with its instances not sent, and its job
// ends failed once its other units end. When the unit that lists the job's
// scans runs out, the job ends failed at once with its units that have not
// started, and a unit still sending records nothing more: a job's counts
// are final once it ends failed. RetryJob sends what was not sent; it may
// send again at most one batch of each unit that was still sending.
//
// How a job ends. Done: every instance sent, with or without a warning.
// Partial: some refused, every other one sent. Failed: some instances not
// sent because attempts ran out. Canceled: CancelJob, or the removal of
// its sender with cancel_jobs. Each state is reached in one transaction
// with its event (EVENT_TYPE_JOB_STEP); while a job runs, its counts are
// reported at most once every 10 seconds (EVENT_TYPE_JOB_PROGRESS). Events
// carry ids, labels, counts and the peer's status codes, never a UID or a
// value read from a file.
//
// How much is kept of each job's failures is the setting job.failures-kept
// (SettingsService): the refused instances, and those sent with a warning,
// a job lists, from 100 to 1000000; an ordinary setting, whose
// installation value the installation's admin sets and a tenant's admin
// may override for the tenant; built-in default "10000". Past it, each is
// still counted, in the job's counts and failures_not_listed, and not
// listed.
//
// Every method acts inside one tenant, named by the request's tenant field,
// so a request into a tenant that is not ready is answered UNAVAILABLE. No
// answer of this service speaks of another tenant.
service JobService {
  // CreateJob makes a job and queues its work. A send job names a sender
  // the tenant has, enabled or not (a disabled sender's jobs wait), and a
  // subject, a session of it or a scan of that, by labels.
  //
  // Role: operator on the tenant.
  // Audit: one entry in the tenant's log, with the new job's id as its
  // object, and its kind, its sender and the path of labels of its target
  // in details.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid
  // (also no kind, a label that does not pass the label rule, a level named
  // without the one above it, and a reception given, which only the
  // server sets), not found (the tenant holds no subject, session or scan
  // with those labels; a tenant that does not exist, for a caller who may
  // list every tenant), precondition (a sender the tenant does not have),
  // unavailable (the tenant's database does not answer, or the tenant is
  // not ready).
  rpc CreateJob(CreateJobRequest) returns (CreateJobResponse);

  // GetJob answers one job, with its counts now.
  //
  // Role: reader on the tenant.
  // Audit: one entry in the tenant's log, with the job's id as its object.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (the tenant has no job with that id; a tenant that does not
  // exist, for a caller who may list every tenant), unavailable (the
  // tenant's database does not answer, or the tenant is not ready).
  rpc GetJob(GetJobRequest) returns (GetJobResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListJobs answers a tenant's jobs, newest first by their create_time,
  // filtered by state, sender and time.
  //
  // Role: reader on the tenant.
  // Audit: one entry in the tenant's log, with the filters in details.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (a tenant that does not exist, for a caller who may list every
  // tenant), unavailable (the tenant's database does not answer, or the
  // tenant is not ready).
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // CancelJob ends a queued or running job as canceled. Its units that have
  // not started are ended in the same transaction; a unit sending ends
  // within one batch (at most 64 instances or one second), and what the
  // peer answered for that batch is still counted, since the peer holds it.
  // A job already canceled is answered as it stands, so a repeated call
  // ends nothing more.
  //
  // Role: operator on the tenant.
  // Audit: one entry in the tenant's log, with the job's id as its object.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (the tenant has no job with that id; a tenant that does not
  // exist, for a caller who may list every tenant), precondition (the job
  // has ended done, partial or failed), unavailable (the tenant's database
  // does not answer, or the tenant is not ready).
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // RetryJob sends again what an ended job did not send: its refused
  // instances and those it never sent, once their cause is mended (a peer
  // that takes the SOP class now, say). The ended job stays as it is, with
  // retry_job naming the new one: a new job of the same kind, sender and
  // target, with retry_of set, whose instances are exactly those, and no
  // instance archived since. A job already retried is answered as it
  // stands, so a repeated call starts nothing more.
  //
  // Role: operator on the tenant.
  // Audit: one entry in the tenant's log, with the ended job's id as its
  // object and the new job's id in details.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (the tenant has no job with that id; a tenant that does not
  // exist, for a caller who may list every tenant), precondition (the job
  // is queued or running, or ended done with nothing to send again; its
  // sender has been removed), unavailable (the tenant's database does not
  // answer, or the tenant is not ready).
  rpc RetryJob(RetryJobRequest) returns (RetryJobResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListJobFailures answers the instances a job's peer refused, or that
  // were refused before they reached it, each with its reason; and, with
  // include_warnings, those sent with a warning. Ordered by subject label,
  // session label, scan label, then SOP Instance UID, each compared byte by
  // byte. At most job.failures-kept are kept per job; the job's
  // failures_not_listed counts the others.
  //
  // Role: reader on the tenant.
  // Audit: one entry in the tenant's log, with the job's id as its object.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (the tenant has no job with that id; a tenant that does not
  // exist, for a caller who may list every tenant), unavailable (the
  // tenant's database does not answer, or the tenant is not ready).
  rpc ListJobFailures(ListJobFailuresRequest) returns (ListJobFailuresResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// JobState is where a job is. A job goes forward only; done, partial,
// failed and canceled are ends that nothing leaves. A state added in a
// later version is a new value, and a client shows a state it does not know
// as one in progress.
enum JobState {
  // Never answered by the server. As a filter, it is refused as invalid.
  JOB_STATE_UNSPECIFIED = 0;

  // Made; none of its work has started yet, as while its sender is down or
  // disabled, or the server's bounds on associations are taken.
  JOB_STATE_QUEUED = 1;

  // Some of its work has started.
  JOB_STATE_RUNNING = 2;

  // Ended. Every instance was sent, some perhaps with a warning.
  JOB_STATE_DONE = 3;

  // Ended. Some instances were refused; every other one was sent.
  JOB_STATE_PARTIAL = 4;

  // Ended without finishing: attempts ran out with instances not sent. The
  // job's reason says why. RetryJob sends what it did not.
  JOB_STATE_FAILED = 5;

  // Ended by CancelJob, or by the removal of its sender with cancel_jobs.
  JOB_STATE_CANCELED = 6;
}

// JobCounts are a job's instances and bytes so far. An instance counts in
// exactly one of sent, sent with a warning, refused and remaining: instances
// equals instances_sent + instances_warned +
// instances_refused + instances_remaining at every answer, and the same
// for bytes. Bytes are those of the archived files: the DICOM file header
// and the data set. The counts are totals, never changes since the last
// answer, so a client that sees one event twice counts nothing twice.
message JobCounts {
  // The instances of the job's target. It grows while the job lists its
  // scans, a page at a time, and by an instance whose archive ended after
  // its scan was listed; listed says when every scan is listed.
  int64 instances = 1;

  // The bytes of those instances.
  int64 bytes = 2;

  // Instances the peer answered success for.
  int64 instances_sent = 3;

  // Bytes of the instances sent.
  int64 bytes_sent = 4;

  // Instances the peer kept with a warning: it changed what it keeps.
  int64 instances_warned = 5;

  // Bytes of the instances sent with a warning.
  int64 bytes_warned = 6;

  // Instances refused, by the peer or before they reached it
  // (JobFailureCode).
  int64 instances_refused = 7;

  // Bytes of the instances refused.
  int64 bytes_refused = 8;

  // Instances not sent yet; in an ended job, those it never sent.
  int64 instances_remaining = 9;

  // Bytes of the instances not sent.
  int64 bytes_remaining = 10;

  // The scans of the job's target, one unit of work each.
  int64 scans = 11;

  // The scans whose unit has ended, whatever it sent.
  int64 scans_done = 12;

  // Whether every scan of the target is listed, so scans is final;
  // instances and bytes are too, but for an archive that ended after its
  // scan was listed.
  bool listed = 13;
}

// SendJob is a job that sends archived instances to one sender: those of a
// subject, of a session of it, or of a scan of that; or, for a job a
// receiver's forward made, those one reception archived.
message SendJob {
  // The name of the tenant's sender it sends to. Required. A sender
  // removed later keeps its name here, and no other sender is given that
  // name while a job names it.
  string sender = 1;

  // The label of the subject whose instances it sends. Required.
  string subject_label = 2;

  // The label of the session of the subject whose instances it sends.
  // Empty for every session of the subject.
  string session_label = 3;

  // The label of the scan of the session whose instances it sends. Empty
  // for every scan of the session; needs session_label.
  string scan_label = 4;

  // The id of the reception whose archived instances it sends, for a job a
  // receiver's forward_to made; then subject_label and session_label are
  // that reception's. Answered by the server; must be empty in CreateJob.
  string reception = 5;

  // The name of the receiver whose forward_to made the job, with
  // reception. Answered by the server; must be empty in CreateJob.
  string receiver = 6;
}

// Job is one piece of work in a tenant, and how far it got.
message Job {
  // The job's id, made by the server, unique in the tenant. Opaque, at most
  // 64 bytes.
  string id = 1;

  // The job's kind and what it acts on. Exactly one is set. A client that
  // finds none of the fields it knows set is reading a kind added later,
  // and shows its state and counts alone.
  oneof kind {
    // Archived instances sent to a sender.
    SendJob send = 2;
  }

  // Where it is.
  JobState state = 3;

  // Its instances and bytes so far.
  JobCounts counts = 4;

  // Why it is not moving, or why it ended as it did, in words for a
  // person, from a fixed set of phrases the server has, such as "sender
  // down", "sender disabled" or "attempts ran out"; at most 256 bytes.
  // Empty while nothing holds it back, and for a job done. It never holds
  // a secret or the peer's own words.
  string reason = 5;

  // The id of the key that made it; empty when the local operator or a
  // receiver's forward_to did (SendJob.receiver says which).
  string created_by_key_id = 6;

  // When it was made: also the moment whose catalog it sends.
  google.protobuf.Timestamp create_time = 7;

  // When its first work started. Absent until then.
  google.protobuf.Timestamp start_time = 8;

  // When it reached its state.
  google.protobuf.Timestamp state_time = 9;

  // When it ended. Absent while it is queued or running.
  google.protobuf.Timestamp end_time = 10;

  // The id of the ended job whose unsent instances this one sends. Empty
  // unless RetryJob made it.
  string retry_of = 11;

  // The id of the job RetryJob made from this one. Empty unless it was
  // retried.
  string retry_job = 12;

  // The refused instances, and those sent with a warning, that are counted
  // and not listed by ListJobFailures, past the setting job.failures-kept.
  int64 failures_not_listed = 13;
}

// JobFailureCode is why an instance of a job was refused, or that it was
// sent with a warning. A code added in a later version is a new value; a
// client shows a code it does not know as refused for a reason it cannot
// name.
enum JobFailureCode {
  // Never answered by the server.
  JOB_FAILURE_CODE_UNSPECIFIED = 0;

  // The peer refused it: a DIMSE peer answered its C-STORE with a failure
  // status, in peer_status (PS3.4 B.2.3); a stow peer listed it in the
  // Failed SOP Sequence, its Failure Reason (0008,1197) in peer_status
  // (PS3.18 Table I.2-2), or refused the whole request with a 4xx other
  // than 401, 403, 407, 408 and 429.
  JOB_FAILURE_CODE_PEER_REFUSED = 1;

  // Sent, and the peer kept it with a warning: a DIMSE peer answered
  // B000, B006 or B007 in peer_status; a stow peer gave a Warning Reason
  // (0008,1196) in peer_status. Listed only with include_warnings.
  JOB_FAILURE_CODE_PEER_WARNING = 2;

  // Not sent: the DIMSE peer rejected every presentation context of the
  // instance's SOP class (PS3.8 9.3.3.2, abstract syntax not supported).
  JOB_FAILURE_CODE_CLASS_NOT_ACCEPTED = 3;

  // Not sent: the DIMSE peer accepts the instance's SOP class, but not in
  // the transfer syntax it is stored in (PS3.8 9.3.3.2, transfer syntaxes
  // not supported). The server does not convert it to another syntax.
  JOB_FAILURE_CODE_SYNTAX_NOT_ACCEPTED = 4;

  // Sent twice to a stow peer whose answer listed it neither as stored nor
  // as failed (PS3.18 10.5.3), so whether the peer holds it is not known.
  JOB_FAILURE_CODE_PEER_UNACCOUNTED = 5;

  // Not sent whole: its bytes on the storage are missing or are not what
  // was archived (their SHA-256 or length differ from the catalog's). A
  // DIMSE association was aborted (A-ABORT, PS3.8 9.3.8) before its last
  // fragment, and a stow request was cut before its part ended, so the peer
  // never held a whole instance. Reported as data loss, as a read of it
  // reports it (DataService).
  JOB_FAILURE_CODE_DAMAGED_IN_STORAGE = 6;

  // Not sent: its file meta information (PS3.10 7.1) cannot be read, so the
  // transfer syntax of its data set, or where the data set begins, is not
  // known; or it names another SOP class or instance than the data set's
  // own (0008,0016) and (0008,0018). Its bytes are what was archived.
  JOB_FAILURE_CODE_META_UNREADABLE = 7;
}

// JobFailure is one instance of a job that was refused, or sent with a
// warning.
message JobFailure {
  // The instance's id in the tenant, as DataService names it.
  string instance_id = 1;

  // The label of its subject.
  string subject_label = 2;

  // The label of its session.
  string session_label = 3;

  // The label of its scan.
  string scan_label = 4;

  // Why it was refused, or that it was sent with a warning.
  JobFailureCode code = 5;

  // The peer's code for it: a DIMSE peer's C-STORE status (PS3.7 Annex C),
  // or a stow peer's Failure Reason or Warning Reason; for a stow request
  // refused whole, its HTTP status, and then peer_status_http is true. Zero
  // when the peer gave none.
  int32 peer_status = 6;

  // Its SOP Class UID (0008,0016), as received, so a class the peer does
  // not take can be told; it names a kind of object, not a person.
  string sop_class_uid = 7;

  // The Transfer Syntax UID it is stored and was offered in (PS3.5 Section
  // 10).
  string transfer_syntax_uid = 8;

  // More about it, in words for a person, from a fixed set of phrases the
  // server has, such as "not accepted: transfer syntax"; at most 256 bytes.
  // Never the peer's own text.
  string detail = 9;

  // When it was refused, or sent.
  google.protobuf.Timestamp time = 10;

  // Whether peer_status is an HTTP status (RFC 9110 15), of a stow request
  // the peer refused whole with no account of each instance, rather than a
  // DICOM status. A client shows an HTTP status in decimal and a DICOM
  // status in hexadecimal, so 404 is never read as 0194.
  bool peer_status_http = 11;
}

// CreateJobRequest is the job to make.
message CreateJobRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The job's kind and what it acts on. Exactly one is required.
  oneof kind {
    // Send a subject, a session or a scan to a sender. Its reception and
    // receiver must be empty.
    SendJob send = 2;
  }
}

// CreateJobResponse is the job made.
message CreateJobResponse {
  // The job, queued.
  Job job = 1;
}

// GetJobRequest names a job.
message GetJobRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The job's id. Required; at most 64 bytes.
  string id = 2;
}

// GetJobResponse is the job named.
message GetJobResponse {
  // The job, with its counts now.
  Job job = 1;
}

// ListJobsRequest asks for a page of a tenant's jobs. Every filter given
// must hold for a job to be listed.
message ListJobsRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // Only the jobs in one of these states. Empty for every state; at most 16
  // values, none of them JOB_STATE_UNSPECIFIED.
  repeated JobState states = 2;

  // Only the jobs that have not ended (queued or running, or a state a
  // later version adds). False for every job.
  bool in_progress = 3;

  // Only the send jobs to the sender of this name. Empty for every sender.
  string sender = 4;

  // Only the jobs made at or after this time. Absent for no lower bound.
  google.protobuf.Timestamp start_time = 5;

  // Only the jobs made before this time. Absent for no upper bound. Must be
  // after start_time when both are set.
  google.protobuf.Timestamp end_time = 6;

  // The most jobs to answer: zero means 100; at most 1000. A larger or
  // negative value is invalid.
  int32 page_size = 7;

  // The next_page_token of the previous page, or empty for the first page.
  // Opaque; at most 1 KiB; refused as invalid with a tenant or filters other
  // than those it was made with.
  string page_token = 8;
}

// ListJobsResponse is a page of jobs.
message ListJobsResponse {
  // The jobs of this page, newest first.
  repeated Job jobs = 1;

  // The page_token that asks for the next page. Empty on the last page.
  string next_page_token = 2;
}

// CancelJobRequest names the job to cancel.
message CancelJobRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The job's id. Required; at most 64 bytes.
  string id = 2;
}

// CancelJobResponse is the job canceled.
message CancelJobResponse {
  // The job, canceled.
  Job job = 1;
}

// RetryJobRequest names the ended job whose unsent instances to send.
message RetryJobRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The ended job's id. Required; at most 64 bytes.
  string id = 2;
}

// RetryJobResponse is the ended job and the one that sends what it did not.
message RetryJobResponse {
  // The ended job, with retry_job set.
  Job job = 1;

  // The new job, queued, with retry_of set.
  Job retry = 2;
}

// ListJobFailuresRequest asks for a page of a job's failures.
message ListJobFailuresRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The job's id. Required; at most 64 bytes.
  string id = 2;

  // Whether to list the instances sent with a warning too. False lists
  // only those refused.
  bool include_warnings = 3;

  // The most failures to answer: zero means 100; at most 1000. A larger or
  // negative value is invalid.
  int32 page_size = 4;

  // The next_page_token of the previous page, or empty for the first page.
  // Opaque; at most 1 KiB; refused as invalid with a tenant, job or
  // include_warnings other than those it was made with.
  string page_token = 5;
}

// ListJobFailuresResponse is a page of a job's failures.
message ListJobFailuresResponse {
  // The failures of this page, by scan label, then instance id.
  repeated JobFailure failures = 1;

  // The page_token that asks for the next page. Empty on the last page.
  string next_page_token = 2;
}
