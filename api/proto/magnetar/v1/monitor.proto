syntax = "proto3";

// Package magnetar.v1: what holds for the whole package (callers, roles, error
// kinds, limits, paging, secrets, partial updates) is said on the package in
// access.proto.
package magnetar.v1;

import "google/protobuf/timestamp.proto";
import "magnetar/v1/quarantine.proto";
import "magnetar/v1/reception.proto";
import "magnetar/v1/receiver.proto";
import "magnetar/v1/scope.proto";
import "magnetar/v1/tenant.proto";

// MonitorService tells what a tenant is doing, in two forms: GetStatus, its
// numbers now, in one answer; and Watch, a live stream of its events, from a
// point a client can resume from. A client that follows a tenant reads its
// status once, then watches from the status's event_cursor: the counts and
// the cursor are read in one snapshot of the tenant's database, so every
// event after the cursor is a change the counts do not hold, and every
// event at or before it is one they do.
//
// Both act on a Scope: one tenant, or the installation, which means every
// tenant at once. Every tenant at once needs operator on the installation:
// what is inside a tenant is not the installation's own object, and reader
// on the installation reads only tenants' registrations and states.
//
// Events are written in the same transaction as the change they report, and
// a tenant's events are answered in the order of the commits that wrote
// them. A reception makes one event per step it reaches, with its counts,
// never one per file, and an accepted association makes none (a reception
// counts the associations that fed it); a quarantined file makes one event
// per file, and so does the decision on it. Events carry labels, ids and
// counts; they never carry an attribute's value or a UID as such. A label is
// as identifying as the naming rule that made it (NamingRule). Events are
// kept for the setting events.retention, and then pruned: a period such as
// "90d", from "1d" to "3650d"; an ordinary setting, whose installation value
// the installation's admin sets and a tenant's admin may override for the
// tenant; built-in default "90d".
service MonitorService {
  // GetStatus answers the numbers now of one tenant, or of every tenant.
  // It answers whatever the tenant's state: a tenant whose database does not
  // answer is answered with its database's state and what the server holds
  // in memory, and without what is read from the database, rather than with
  // an error, since that is when its status matters most.
  //
  // Role: reader on the tenant asked for; operator on the installation for
  // every tenant.
  // Audit: one entry in the log of the scope asked for (for every tenant,
  // the installation's log).
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid
  // (also a page_size or page_token with a tenant scope), not found (a
  // tenant that does not exist, for a caller who may list every tenant),
  // unavailable (the master database does not answer).
  // Limits: for every tenant, a page of tenants, ordered by name, as a list
  // is paged.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Watch streams the events of one tenant, or of every tenant, as they are
  // committed, starting after the cursors given or, without them, from now.
  // The first message of every stream is a keep-alive, sent at once, which
  // says the stream is open and gives the cursors it starts from. After
  // that, when nothing is sent for 15 seconds the server sends another, so
  // a client that hears nothing for much longer knows the stream is lost
  // and resumes from its last cursors.
  //
  // The server keeps no queue per client: it reads each client's events
  // from the tenants' databases at the pace the client reads them, so a
  // slow client falls behind without costing the server memory, and loses
  // nothing until its cursor is older than what is kept. A stream may end
  // at any time, such as when the server stops (UNAVAILABLE); the client
  // resumes from the cursors of the last event or keep-alive it received.
  //
  // With every tenant, the events of each tenant come in that tenant's
  // commit order, with no order between tenants. Each event's cursor is its
  // tenant's, and each keep-alive carries every tenant's cursor in
  // tenant_cursors, which a new stream takes to resume tenant by tenant. A
  // tenant whose database stops answering is skipped while the stream goes
  // on, and its events follow from where they stopped when it answers
  // again; a tenant created while the stream is open joins it from its
  // first event, and a tenant removed leaves it.
  //
  // The caller's key and grant are checked again at least every 15 seconds
  // while the stream is open: a key revoked or expired, or a grant removed,
  // ends the stream with the answer a new call would get, and so does the
  // removal of the one tenant a stream watches.
  //
  // Role: reader on the tenant asked for; operator on the installation for
  // every tenant.
  // Audit: one entry in the log of the scope asked for when the stream
  // opens, with the cursors' presence and the event types in details, and
  // one when it ends, with how many events it carried.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid
  // (also a cursor not made by a Watch or status of the tenant it is given
  // for, cursor with every tenant or tenant_cursors with one tenant), not
  // found (a tenant that does not exist, for a caller who may list every
  // tenant), cursor expired (a cursor points before the oldest event its
  // tenant keeps; the message names the tenant; the client reads that
  // tenant's status again and watches from its event_cursor), unavailable
  // (with one tenant, its database does not answer or it is not ready, when
  // the stream opens or while it is open; the client resumes later from its
  // last cursor), resource exhausted (the caller, a key or the local
  // operator, already holds 16 open streams, or the server holds 1024).
  // Limits: no deadline is applied to the stream when the client sends
  // none; the 30-second default of other calls does not hold here.
  rpc Watch(WatchRequest) returns (stream WatchResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// ReceptionStepCount is how many receptions are in one step.
message ReceptionStepCount {
  // The step.
  ReceptionStep step = 1;

  // How many receptions of the tenant are in it now.
  int64 receptions = 2;
}

// TenantCounts are the numbers of a tenant kept in its database. They are
// running totals, updated in the transaction of each change, so they equal
// what the catalog holds after every commit and are not counted per call.
message TenantCounts {
  // Subjects in the catalog.
  int64 subjects = 1;

  // Sessions in the catalog.
  int64 sessions = 2;

  // Scans in the catalog.
  int64 scans = 3;

  // Instances (archived files) in the catalog.
  int64 instances = 4;

  // Quarantined files held now: not released or rejected.
  int64 quarantined_files = 5;

  // Bytes the server holds for the quarantined files held now; a record
  // whose bytes were never kept counts none.
  int64 quarantined_bytes = 6;

  // The receptions in progress, one entry per step that has any, in the
  // order of the steps. A step with none is left out. The ended steps
  // (done, quarantined, failed) are never listed.
  repeated ReceptionStepCount receptions_in_progress = 7;

  // Bytes the tenant holds in the server's incoming area: files received
  // and not yet archived, files of failed receptions not yet retried or
  // discarded, and quarantined files held.
  int64 incoming_bytes = 8;
}

// Throughput is how fast files move through a tenant now, measured by the
// server over the last 10 seconds. It is held in memory, not in the
// database snapshot: after a restart it starts again from zero.
message Throughput {
  // Files received per second, into every receiver of the tenant.
  double files_received_per_second = 1;

  // Bytes received per second.
  double bytes_received_per_second = 2;

  // Files archived per second, to every storage of the tenant.
  double files_archived_per_second = 3;

  // Bytes archived per second.
  double bytes_archived_per_second = 4;
}

// StorageStatus is a storage's space now.
message StorageStatus {
  // The storage's name.
  string storage = 1;

  // Bytes the tenant holds on it: its archived files, manifests and
  // metadata, as the catalog records them in the status's snapshot.
  int64 used_bytes = 2;

  // Bytes it can still take: the smaller of what its file system reports
  // free and what is left under its capacity_bytes, read when the status is
  // made. Absent when unknown: an S3 storage with no capacity_bytes, or a
  // file system that did not answer.
  optional int64 free_bytes = 3;

  // Its capacity_bytes; zero for none.
  int64 capacity_bytes = 4;

  // Whether its free space is below its reserve (the installation's setting
  // storage.reserve, ReceiverService), so its
  // receivers refuse new associations until space returns. False when its
  // free space is unknown.
  bool nearly_full = 5;
}

// ReceiverStatus is a receiver's state now.
message ReceiverStatus {
  // The receiver's name.
  string receiver = 1;

  // Whether it accepts data, and why not.
  ReceiverHealth health = 2;

  // Whether it admits any caller, so a status shows a receiver open to
  // everyone.
  bool any_caller = 3;
}

// TenantStatus is one tenant's numbers now.
message TenantStatus {
  // The tenant's name.
  string tenant = 1;

  // Whether the tenant's database answers and its tables are current, from
  // the server's current view, as TenantService answers it.
  TenantState database_state = 2;

  // When the tenant entered that state.
  google.protobuf.Timestamp database_state_time = 3;

  // The position of the tenant's event feed in the same snapshot as the
  // counts: a Watch of this tenant from this cursor answers exactly the
  // events whose changes the counts do not hold. Empty when the tenant's
  // database did not answer. Opaque; at most 1 KiB.
  string event_cursor = 4;

  // The tenant's counts. Absent when its database did not answer.
  TenantCounts counts = 5;

  // How fast files move through it now.
  Throughput throughput = 6;

  // Each of its storages, ordered by name. Empty when its database did not
  // answer; a client tells that from a tenant with no storage by counts
  // being absent.
  repeated StorageStatus storages = 7;

  // Each of its receivers, ordered by name, from the server's memory, so
  // they are answered also when its database does not answer.
  repeated ReceiverStatus receivers = 8;

  // The tenant's setting incoming.limit in bytes: the most it may hold in
  // the server's incoming area before its receivers refuse new
  // associations. Zero for no limit of its own.
  int64 incoming_limit_bytes = 9;
}

// GetStatusRequest asks for the status of one tenant or of every tenant.
message GetStatusRequest {
  // A tenant, for its status; or the installation, for every tenant's.
  // Required.
  Scope scope = 1;

  // With the installation, the most tenants to answer: zero means 100; at
  // most 1000. A larger or negative value is invalid. Must be zero with a
  // tenant.
  int32 page_size = 2;

  // With the installation, the next_page_token of the previous page, or
  // empty for the first page. Opaque; at most 1 KiB. Must be empty with a
  // tenant.
  string page_token = 3;
}

// GetStatusResponse is the status asked for.
message GetStatusResponse {
  // One tenant's status, or a page of every tenant's, ordered by name. Every
  // tenant the scope covers is answered, whatever its state.
  repeated TenantStatus tenants = 1;

  // The page_token that asks for the next page. Empty on the last page, and
  // always with a tenant scope.
  string next_page_token = 2;

  // When the answer was made.
  google.protobuf.Timestamp time = 3;
}

// EventType is the kind of an event. A type added in a later version is a
// new value with a new payload: a client skips an event of a type it does
// not know, and takes its cursor.
enum EventType {
  // Never answered by the server; refused as invalid in a filter.
  EVENT_TYPE_UNSPECIFIED = 0;

  // A receiver turned callers away.
  EVENT_TYPE_ASSOCIATION_FAILED = 1;

  // A reception reached a step.
  EVENT_TYPE_RECEPTION_STEP = 2;

  // A file was quarantined.
  EVENT_TYPE_FILE_QUARANTINED = 3;

  // A quarantined file was released or rejected.
  EVENT_TYPE_QUARANTINE_DECIDED = 4;

  // A receiver went up or down, or down for another reason.
  EVENT_TYPE_RECEIVER_HEALTH = 5;

  // A storage became nearly full, or recovered.
  EVENT_TYPE_STORAGE_SPACE = 6;
}

// AssociationFailure is why a DIMSE receiver turned a caller away. Each
// value says which mechanism of PS3.8 the caller saw. A value added in a
// later version is a new value.
enum AssociationFailure {
  // Never answered by the server.
  ASSOCIATION_FAILURE_UNSPECIFIED = 0;

  // Rejected (A-ASSOCIATE-RJ, rejected-permanent, PS3.8 9.3.4,
  // "calling-AE-title-not-recognized"): the caller matches none of the
  // receiver's allowed callers.
  ASSOCIATION_FAILURE_CALLER_NOT_ALLOWED = 1;

  // Rejected (A-ASSOCIATE-RJ, rejected-permanent,
  // "called-AE-title-not-recognized"): the caller called an AE title that
  // is not the receiver's.
  ASSOCIATION_FAILURE_CALLED_AE_TITLE_NOT_RECOGNIZED = 2;

  // Accepted with every presentation context rejected (A-ASSOCIATE-AC,
  // PS3.8 9.3.3.2, "abstract-syntax-not-supported" or
  // "transfer-syntaxes-not-supported"): the association exists, but no
  // proposed SOP class and transfer syntax is one the receiver accepts, so
  // nothing can be sent on it. This event is the only one it makes.
  ASSOCIATION_FAILURE_NO_ACCEPTABLE_CONTEXT = 3;

  // Rejected (A-ASSOCIATE-RJ, rejected-transient): the incoming area or the
  // receiver's storage has less free space than its reserve
  // (storage.reserve).
  ASSOCIATION_FAILURE_NEARLY_FULL = 4;

  // Rejected (A-ASSOCIATE-RJ, rejected-transient): the tenant is not ready.
  ASSOCIATION_FAILURE_TENANT_NOT_READY = 5;

  // The TLS handshake failed and the connection was closed before any
  // association was asked for; the caller's AE titles are unknown.
  ASSOCIATION_FAILURE_TLS_FAILED = 6;

  // Aborted by the receiver (A-ABORT, PS3.8 9.3.8) because the caller broke
  // the upper layer protocol (PS3.8 Section 9), before or after the
  // association was accepted. Files the association had already stored
  // stay received; a store it cut short is not kept. This event is the
  // only one it makes.
  ASSOCIATION_FAILURE_PROTOCOL_ERROR = 7;

  // Rejected (A-ASSOCIATE-RJ, rejected-transient): the tenant holds as many
  // bytes in the incoming area as its setting incoming.limit allows.
  ASSOCIATION_FAILURE_INCOMING_LIMIT = 8;
}

// StorageSpaceState is whether a storage has room.
enum StorageSpaceState {
  // Never answered by the server.
  STORAGE_SPACE_STATE_UNSPECIFIED = 0;

  // Its free space fell below its reserve (the installation's setting
  // storage.reserve).
  STORAGE_SPACE_STATE_NEARLY_FULL = 1;

  // Its free space is above its reserve again.
  STORAGE_SPACE_STATE_RECOVERED = 2;
}

// AssociationFailed is a receiver turning callers away. Failures are grouped
// by receiver, failure and the caller's host address (without its port):
// the first failure of a group makes an event at once, and further ones in
// the minute after it are counted and make one event at the end of that
// minute. When more than 64 distinct hosts fail at one receiver within a
// minute, the failures of the hosts beyond those 64 are folded into one
// event at the end of the minute, with caller empty. So a caller trying
// again and again, or many callers at once, cannot flood the feed.
message AssociationFailed {
  // The receiver's name.
  string receiver = 1;

  // Who called, as far as it is known: the host's address without its port,
  // and the AE titles when they were read. Absent for the event that folds
  // the failures of many hosts together.
  Caller caller = 2;

  // Why the caller was turned away.
  AssociationFailure failure = 3;

  // How many failures the event stands for: 1 for the first of a group,
  // more for an event at the end of a minute.
  int64 count = 4;

  // How many distinct hosts the event stands for: 1, or more for the event
  // that folds many hosts together.
  int64 hosts = 5;
}

// ReceptionStepReached is a reception reaching a step.
message ReceptionStepReached {
  // The reception's id.
  string reception = 1;

  // The name of the receiver it arrived at.
  string receiver = 2;

  // Its arrival number: 1 for the first reception of its study, more for a
  // later one.
  int32 arrival = 3;

  // The step it reached.
  ReceptionStep step = 4;

  // Its totals when it reached the step.
  ReceptionCounts counts = 5;

  // Its subject's label. Empty before it is identified.
  string subject_label = 6;

  // Its session's label. Empty before it is identified.
  string session_label = 7;

  // The id of the failed reception it runs again. Empty unless it was made
  // by RetryReception.
  string retry_of = 8;
}

// FileQuarantined is one file quarantined.
message FileQuarantined {
  // The quarantined file's record id.
  string file = 1;

  // The id of its reception. Empty when it had none.
  string reception = 2;

  // The name of the receiver it arrived at.
  string receiver = 3;

  // Why it was quarantined.
  QuarantineReason reason = 4;

  // Its size in bytes.
  int64 size_bytes = 5;

  // The tenant's quarantined files held, this one included.
  int64 held_files = 6;

  // The bytes the server holds for the tenant's quarantined files held, as
  // TenantCounts.quarantined_bytes counts them.
  int64 held_bytes = 7;
}

// QuarantineDecided is a quarantined file released or rejected.
message QuarantineDecided {
  // The quarantined file's record id.
  string file = 1;

  // What was decided: released or rejected.
  QuarantineState state = 2;

  // How it was released. RELEASE_MODE_UNSPECIFIED for a rejection.
  ReleaseMode release_mode = 3;

  // The id of the reception its release joined. Empty for a rejection.
  string release_reception = 4;

  // The tenant's quarantined files held after the decision.
  int64 held_files = 5;

  // The bytes the server holds for the tenant's quarantined files held
  // after the decision, as TenantCounts.quarantined_bytes counts them.
  int64 held_bytes = 6;
}

// ReceiverHealthChanged is a receiver's state changing.
message ReceiverHealthChanged {
  // The receiver's name.
  string receiver = 1;

  // Its new state.
  ReceiverHealth health = 2;
}

// StorageSpaceChanged is a storage becoming nearly full or recovering.
message StorageSpaceChanged {
  // The storage's name.
  string storage = 1;

  // Whether it is nearly full or recovered.
  StorageSpaceState state = 2;

  // Its used bytes then.
  int64 used_bytes = 3;

  // Its free bytes then. Absent when unknown.
  optional int64 free_bytes = 4;
}

// Event is one thing that happened in a tenant.
message Event {
  // The event's cursor: a Watch of its tenant from it answers the events
  // after this one. Opaque; at most 1 KiB; compared whole, never parsed or
  // ordered by a client.
  string cursor = 1;

  // When the change it reports was committed.
  google.protobuf.Timestamp time = 2;

  // The name of the tenant it happened in.
  string tenant = 3;

  // Its type: always the one that names the payload set.
  EventType type = 4;

  // What happened. Exactly one is set, the one its type names. A client
  // that finds none it knows set is reading a type added later.
  oneof payload {
    // A receiver turned callers away.
    AssociationFailed association_failed = 5;

    // A reception reached a step.
    ReceptionStepReached reception_step = 6;

    // A file was quarantined.
    FileQuarantined file_quarantined = 7;

    // A quarantined file was released or rejected.
    QuarantineDecided quarantine_decided = 8;

    // A receiver's state changed.
    ReceiverHealthChanged receiver_health = 9;

    // A storage became nearly full or recovered.
    StorageSpaceChanged storage_space = 10;
  }
}

// WatchKeepAlive opens every stream, and is sent again when no event has
// been sent for 15 seconds.
message WatchKeepAlive {
  // When it was sent.
  google.protobuf.Timestamp time = 1;

  // On one tenant, the position the stream has read up to, past events the
  // filter left out: resuming from it skips them again rather than reading
  // them a second time. Empty with every tenant. Opaque; at most 1 KiB.
  string cursor = 2;

  // With every tenant, the position the stream has read up to in each
  // tenant whose database answered, by tenant name; a tenant missing here
  // is one the stream has not read yet. Empty with one tenant. Each cursor
  // is opaque, at most 1 KiB.
  map<string, string> tenant_cursors = 3;
}

// WatchRequest asks for a stream of events.
message WatchRequest {
  // A tenant, for its events; or the installation, for every tenant's.
  // Required.
  Scope scope = 1;

  // With one tenant, start after this cursor: an event's cursor, a
  // keep-alive's, or a status's event_cursor, of the same tenant. Empty to
  // start from now. Opaque; at most 1 KiB. Must be empty with every tenant.
  string cursor = 2;

  // Only events of these types. Empty for every type; at most 16 values,
  // none of them EVENT_TYPE_UNSPECIFIED.
  repeated EventType types = 3;

  // With every tenant, where to start in each tenant, by tenant name: a
  // keep-alive's tenant_cursors, or cursors gathered from events and
  // statuses. A tenant not listed starts from now; a listed tenant that no
  // longer exists is left out. At most 10000 entries, each cursor at most
  // 1 KiB, within the 4 MB limit of a message. Must be empty with one
  // tenant.
  map<string, string> tenant_cursors = 4;
}

// WatchResponse is one message of the stream: an event or a keep-alive.
message WatchResponse {
  // Which it is. Exactly one is set.
  oneof kind {
    // An event.
    Event event = 1;

    // The stream is open: the first message, and again after 15 seconds
    // with no event.
    WatchKeepAlive keep_alive = 2;
  }
}
