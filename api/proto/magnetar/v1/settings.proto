syntax = "proto3";

// Package magnetar.v1: what holds for the whole package (callers, roles, error
// kinds, paging, secrets) is said on the package in access.proto.
package magnetar.v1;

// SettingsService reads and changes settings. The installation holds a default
// for every setting; a tenant may override some of them. A setting is
// resolved as the tenant's override when it has one, else the installation's
// default. A setting never holds a secret.
service SettingsService {
  // GetSetting answers the value of one setting as it applies to the scope
  // asked for: on the installation, its default; on a tenant, the tenant's
  // override when it has one, else the installation's default. The answer's
  // scope says which of the two the value came from.
  //
  // Role: reader on the scope asked for (that tenant, or the installation).
  // Audit: one entry in the log of the scope asked for, with the setting's
  // name.
  // Errors: invalid, unauthenticated, permission denied (also when the tenant
  // does not exist), not found (no setting has that name), unavailable.
  rpc GetSetting(GetSettingRequest) returns (GetSettingResponse);

  // SetSetting sets the installation's default of a setting, or a tenant's
  // override of it. The change and its audit entry are written together or
  // not at all.
  //
  // Role: admin on the scope set (that tenant, or the installation).
  // Audit: one entry in the log of the scope set, with the setting's name
  // and its new value.
  // Errors: invalid (also a value the setting does not accept), unauthenticated,
  // permission denied (also when the tenant does not exist), not found (no
  // setting has that name), unavailable.
  rpc SetSetting(SetSettingRequest) returns (SetSettingResponse);

  // ListSettings answers the settings set on one scope, ordered by name: on
  // the installation, every setting's default; on a tenant, only that
  // tenant's overrides.
  //
  // Role: reader on the scope asked for (that tenant, or the installation).
  // Audit: one entry in the log of the scope asked for.
  // Errors: invalid, unauthenticated, permission denied (also when the tenant
  // does not exist), unavailable.
  rpc ListSettings(ListSettingsRequest) returns (ListSettingsResponse);
}

// Setting is one named value, set on the installation or on a tenant.
message Setting {
  // The setting's name, from the fixed list of settings the server knows.
  string name = 1;

  // Where the value is set. Exactly one is set.
  oneof scope {
    // The value is the override of this tenant.
    string tenant = 2;

    // The value is the installation's default. Must be true when set.
    bool installation = 3;
  }

  // The value, in the text form the setting defines, such as "90d" for a
  // period. The server refuses a value that form does not accept.
  string value = 4;
}

// GetSettingRequest names a setting and the scope to resolve it on.
message GetSettingRequest {
  // The setting's name. Required.
  string name = 1;

  // The scope the value is resolved on. Exactly one is set.
  oneof scope {
    // Resolve on this tenant: its override, else the installation's default.
    string tenant = 2;

    // Answer the installation's default. Must be true when set.
    bool installation = 3;
  }
}

// GetSettingResponse is the setting's value on the scope asked for.
message GetSettingResponse {
  // The setting; its scope is where its value came from.
  Setting setting = 1;
}

// SetSettingRequest is the value to set.
message SetSettingRequest {
  // The setting. Its name, scope and value are required.
  Setting setting = 1;
}

// SetSettingResponse is the setting as stored.
message SetSettingResponse {
  // The setting, as stored.
  Setting setting = 1;
}

// ListSettingsRequest asks for a page of the settings set on one scope.
message ListSettingsRequest {
  // The scope to list. Exactly one is set.
  oneof scope {
    // List this tenant's overrides.
    string tenant = 1;

    // List the installation's defaults. Must be true when set.
    bool installation = 2;
  }

  // The most settings to answer. Zero means the server's default; a value
  // above the server's maximum is lowered to it; a negative value is invalid.
  int32 page_size = 3;

  // The next_page_token of the previous page, or empty for the first page.
  // A token is refused as invalid with a scope other than the one it was made
  // with.
  string page_token = 4;
}

// ListSettingsResponse is a page of settings.
message ListSettingsResponse {
  // The settings of this page.
  repeated Setting settings = 1;

  // The page_token that asks for the next page. Empty on the last page.
  string next_page_token = 2;
}
