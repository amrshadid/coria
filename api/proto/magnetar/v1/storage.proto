syntax = "proto3";

// Package magnetar.v1: what holds for the whole package (callers, roles, error
// kinds, limits, paging, secrets, partial updates) is said on the package in
// access.proto.
package magnetar.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// StorageService adds, reads, changes, removes and tests a tenant's storages:
// the places its archived files are written to, a directory on the server or
// a bucket of an S3 object store. A storage belongs to one tenant, and its
// configuration lives in that tenant's database. A storage's used and free
// space are answered by MonitorService.GetStatus, not here.
//
// Every method acts inside one tenant, named by the request's tenant field,
// so a request into a tenant that is not ready is answered UNAVAILABLE.
service StorageService {
  // AddStorage adds a storage to a tenant. It records the configuration and
  // touches nothing on the storage itself: TestStorage checks that the
  // storage can be written to, and GetStatus reports its space.
  //
  // Role: admin on the tenant.
  // Audit: one entry in the tenant's log, with the storage's name as its
  // object and its type in details; never its secret, its endpoint's
  // credentials or its path.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid
  // (also a directory outside the directories the installation allows for
  // storages, or a plain http endpoint the installation does not allow; see
  // DirectoryStorage and S3Storage), not found (a tenant that does not
  // exist, for a caller who may list every tenant), conflict (the tenant has
  // a storage with that name; or a directory that contains, or lies inside,
  // the directory of another storage of the installation, of any tenant),
  // unavailable (the tenant's database does not answer, or the tenant is not
  // ready).
  rpc AddStorage(AddStorageRequest) returns (AddStorageResponse);

  // GetStorage answers one storage of a tenant. Its secret is never
  // answered: the answer says only whether one is set.
  //
  // Role: reader on the tenant.
  // Audit: one entry in the tenant's log, with the storage's name as its
  // object.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (the tenant has no storage with that name; a tenant that does
  // not exist, for a caller who may list every tenant), unavailable (the
  // tenant's database does not answer, or the tenant is not ready).
  rpc GetStorage(GetStorageRequest) returns (GetStorageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListStorages answers the storages of a tenant, ordered by name, without
  // their secrets.
  //
  // Role: reader on the tenant.
  // Audit: one entry in the tenant's log.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (a tenant that does not exist, for a caller who may list every
  // tenant), unavailable (the tenant's database does not answer, or the
  // tenant is not ready).
  rpc ListStorages(ListStoragesRequest) returns (ListStoragesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SetStorage changes some fields of a storage: those its update_mask
  // names, and no other. A secret the mask does not name is kept as it is,
  // so a change of the endpoint does not need the secret sent again. The
  // change and its audit entry are written together or not at all.
  //
  // A storage's type cannot change: a mask that names the other type's
  // configuration is invalid. Once the storage holds an archived file, the
  // fields that say where its files are (a directory's path, an S3
  // storage's bucket and prefix) cannot change, since the files would no
  // longer be where the catalog says: such a change is a conflict. An S3
  // storage's endpoint may change, for a store that moved to another
  // address with its data.
  //
  // Role: admin on the tenant.
  // Audit: one entry in the tenant's log, with the storage's name as its
  // object and the mask's paths in details; never a value of a secret.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid
  // (also an empty mask, a path that names no field or a read-only field, a
  // path into the other type's configuration, and every rule AddStorage
  // checks), not found (the tenant has no storage with that name; a tenant
  // that does not exist, for a caller who may list every tenant), conflict
  // (a change of where the files are on a storage that holds files; a
  // directory that overlaps another storage's), unavailable (the tenant's
  // database does not answer, or the tenant is not ready).
  rpc SetStorage(SetStorageRequest) returns (SetStorageResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // RemoveStorage removes a storage's configuration from a tenant. It never
  // deletes a file: it is refused while the storage holds any archived file
  // or while a receiver names it as its storage, so the configuration of a
  // storage that holds data is never lost. A repeated call finds no storage
  // and is answered NOT_FOUND; it removes nothing more.
  //
  // Role: admin on the tenant.
  // Audit: one entry in the tenant's log, with the storage's name as its
  // object and its type in details.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (the tenant has no storage with that name; a tenant that does
  // not exist, for a caller who may list every tenant), conflict (the
  // storage holds archived files, or a receiver names it; the message names
  // which), unavailable (the tenant's database does not answer, or the
  // tenant is not ready).
  rpc RemoveStorage(RemoveStorageRequest) returns (RemoveStorageResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // TestStorage writes one small object of random bytes to the storage,
  // reads it back, compares its SHA-256 with what was written, and removes
  // it, and reports each step. The object's key is under a prefix no
  // archived file uses, so the test never touches data. A storage that
  // fails a step is a result, not an error: the method succeeds and the
  // failed step says why. A step after a failed one is answered skipped,
  // except the removal, which is tried whenever the write may have left an
  // object. Repeating the test leaves the storage as it was.
  //
  // Role: admin on the tenant.
  // Audit: one entry in the tenant's log, with the storage's name as its
  // object and whether every step passed in details.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (the tenant has no storage with that name; a tenant that does
  // not exist, for a caller who may list every tenant), unavailable (the
  // tenant's database does not answer, or the tenant is not ready).
  // Limits: the whole test is bounded by the call's deadline; each step
  // that has not finished when it passes is answered failed.
  rpc TestStorage(TestStorageRequest) returns (TestStorageResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// Storage is a place a tenant's archived files are written to. Its files lie
// under two trees of keys: data/<subject>/<session>/<scan>/ for the DICOM
// files, one per instance, and meta/<subject>/<session>/<scan>/ for each
// scan's manifest and metadata. It never carries a secret.
message Storage {
  // The storage's name, unique in its tenant, and its id in this API. It
  // does not change. 1 to 63 characters, lowercase ASCII letters, digits and
  // hyphens, starting with a letter, and none of the device names Windows
  // reserves (con, prn, aux, nul, com0 to com9, lpt0 to lpt9): the rule of a
  // tenant's name.
  string name = 1;

  // The storage's type and the configuration of that type. Exactly one is
  // set; a storage with neither is refused as invalid. A type added in a
  // later version is a new field of this oneof: a client that finds none of
  // the fields it knows set is reading a storage of a type it does not know,
  // and shows it as such.
  oneof type {
    // A directory on the server's file system, local or mounted.
    DirectoryStorage directory = 2;

    // A bucket of an object store that speaks the S3 API.
    S3Storage s3 = 3;
  }

  // The most bytes of archived files the storage may hold, for a storage
  // that cannot report its free space (an S3 bucket) or that must use less
  // than its disk has. Zero means no limit of the storage's own: a directory
  // is then bounded by its file system, and an S3 storage reports its free
  // space as unknown. When set, the free space reported is the smaller of
  // what is left under the limit and what the file system reports. At most
  // 2^62; negative is invalid.
  int64 capacity_bytes = 4;

  // When the storage was added. Answered by the server; ignored in a
  // request.
  google.protobuf.Timestamp create_time = 5;

  // When the storage's configuration last changed: its create_time until
  // the first SetStorage. Answered by the server; ignored in a request.
  google.protobuf.Timestamp update_time = 6;
}

// DirectoryStorage is a directory on the server's file system.
message DirectoryStorage {
  // The directory's absolute path on the server, as the server's operating
  // system writes it; at most 4096 bytes of UTF-8, with no "." or ".."
  // component. Required. The directory must lie inside one of the
  // directories the installation allows for storages (the installation's
  // setting storage.directory-roots: absolute paths separated by the
  // operating system's path list separator, ":" on Linux and macOS and ";"
  // on Windows; while it is empty, no directory storage can be added), must
  // not lie inside the server's own data directory, and
  // must not contain or lie inside another storage's directory, of any
  // tenant. The server makes the directory when it does not exist. It is
  // not a secret, but it is answered only to a caller with a grant on the
  // tenant.
  string path = 1;
}

// S3Storage is a bucket, or a part of one under a prefix, on an object store
// that speaks the S3 API. Its credentials are the storage's own: the server
// never falls back to credentials of its own environment (instance roles,
// shared credential files), which would let one tenant reach what another
// tenant's credentials guard.
message S3Storage {
  // The store's base URL, such as "https://s3.eu-central-1.amazonaws.com" or
  // "https://minio.example.org:9000"; at most 2048 bytes. Empty means AWS S3
  // in region. It must be an https URL with no user information, query or
  // fragment; an http URL is accepted only when the installation's setting
  // storage.allow-plain-http is "true", since over plain http the credentials'
  // signatures and every archived file cross the network unencrypted.
  string endpoint = 1;

  // The region the bucket is in, as the store names it, such as
  // "eu-central-1". Required, also for a store that ignores it (which
  // accepts any value, commonly "us-east-1"); at most 64 bytes of lowercase
  // ASCII letters, digits and hyphens.
  string region = 2;

  // The bucket's name. Required; 3 to 63 characters of lowercase ASCII
  // letters, digits, "." and "-", starting and ending with a letter or a
  // digit, as the S3 API names a bucket. The bucket exists before the
  // storage is added: the server never makes or removes a bucket.
  string bucket = 3;

  // The prefix under which every key of the storage is written, so several
  // storages can share one bucket. Empty for the whole bucket. At most 512
  // bytes of ASCII letters, digits, ".", "_", "-" and "/", not starting with
  // "/", ending with "/", and with no empty, "." or ".." part; so
  // "magnetar/lab-a/" is valid and "magnetar/lab-a" is not.
  string prefix = 4;

  // Whether the bucket is addressed in the URL's path
  // (https://endpoint/bucket/key) rather than in its host name
  // (https://bucket.endpoint/key). Most stores other than AWS S3 need true;
  // AWS S3 needs false.
  bool path_style = 5;

  // The access key id of the credentials the server uses, as the store
  // issued it; at most 128 bytes of printable ASCII. Required. It names the
  // credentials and is not a secret: it is answered, so a person can tell
  // which credentials a storage uses when they are rotated.
  string access_key_id = 6;

  // SECRET. The secret access key that goes with access_key_id; at most 128
  // bytes of printable ASCII. Required by AddStorage. It only comes in: the
  // server seals it with the installation key, and no answer, log or audit
  // entry ever holds it; it is always empty in an answer, and
  // secret_access_key_set says whether one is held. SetStorage keeps the
  // held secret unless its mask names s3.secret_access_key, and then the
  // new one must not be empty. The debug_redact mark is read by the
  // server's redactor; the protobuf library itself still prints the field.
  string secret_access_key = 7 [debug_redact = true];

  // Whether the server holds a secret access key for this storage. Answered
  // by the server; ignored in a request.
  bool secret_access_key_set = 8;
}

// StorageTestStep is one step of TestStorage.
enum StorageTestStep {
  // Not a step. Never answered by the server.
  STORAGE_TEST_STEP_UNSPECIFIED = 0;

  // The test object is written.
  STORAGE_TEST_STEP_WRITE = 1;

  // The test object is read back whole.
  STORAGE_TEST_STEP_READ = 2;

  // The SHA-256 of what was read is compared with that of what was written.
  STORAGE_TEST_STEP_COMPARE = 3;

  // The test object is removed.
  STORAGE_TEST_STEP_REMOVE = 4;
}

// StorageTestOutcome is how one step of TestStorage ended.
enum StorageTestOutcome {
  // Never answered by the server.
  STORAGE_TEST_OUTCOME_UNSPECIFIED = 0;

  // The step did what it should.
  STORAGE_TEST_OUTCOME_PASSED = 1;

  // The step did not; the result's message says why.
  STORAGE_TEST_OUTCOME_FAILED = 2;

  // The step was not tried, because a step it needs failed.
  STORAGE_TEST_OUTCOME_SKIPPED = 3;
}

// StorageTestResult is the outcome of one step of TestStorage.
message StorageTestResult {
  // The step.
  StorageTestStep step = 1;

  // How it ended.
  StorageTestOutcome outcome = 2;

  // How long it took. Absent for a skipped step.
  google.protobuf.Duration duration = 3;

  // Why a failed step failed, in words for a person, such as "access
  // denied" or "no such bucket"; empty for another outcome. It never holds
  // a secret, a signature, or the body of the store's answer, so a storage
  // pointed at an address that is not a store cannot be used to read what
  // that address answers.
  string message = 4;
}

// AddStorageRequest is the storage to add.
message AddStorageRequest {
  // The tenant to add it to, by name. Required.
  string tenant = 1;

  // The storage. Its name and type are required, with what its type's
  // message requires; create_time, update_time and secret_access_key_set
  // are ignored.
  Storage storage = 2;
}

// AddStorageResponse is the storage added.
message AddStorageResponse {
  // The storage, as stored, without its secret.
  Storage storage = 1;
}

// GetStorageRequest names a storage.
message GetStorageRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The storage's name. Required.
  string name = 2;
}

// GetStorageResponse is the storage named.
message GetStorageResponse {
  // The storage, without its secret.
  Storage storage = 1;
}

// ListStoragesRequest asks for a page of a tenant's storages.
message ListStoragesRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The most storages to answer: zero means 100; at most 1000. A larger or
  // negative value is invalid.
  int32 page_size = 2;

  // The next_page_token of the previous page, or empty for the first page.
  // Opaque; at most 1 KiB; refused as invalid with a tenant other than the
  // one it was made with.
  string page_token = 3;
}

// ListStoragesResponse is a page of storages.
message ListStoragesResponse {
  // The storages of this page, without their secrets.
  repeated Storage storages = 1;

  // The page_token that asks for the next page. Empty on the last page.
  string next_page_token = 2;
}

// SetStorageRequest is the change to a storage.
message SetStorageRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The storage with the new values of the fields update_mask names. Its
  // name is required and names the storage to change; it is not itself
  // changed. Fields the mask does not name are ignored.
  Storage storage = 2;

  // The fields to change, as paths of Storage: "capacity_bytes", or a field
  // of the storage's type joined to it by a dot, such as "s3.endpoint",
  // "s3.secret_access_key" or "directory.path". A path that names a type's
  // whole message ("s3", "directory") is refused: its fields are named one
  // by one, so a secret is never replaced by leaving it out. Required and
  // not empty; "*" is refused, so every field a call changes is named. A
  // named field is set to the value given, its zero value included, except
  // a secret, which must not be empty.
  google.protobuf.FieldMask update_mask = 3;
}

// SetStorageResponse is the storage as changed.
message SetStorageResponse {
  // The storage, as stored, without its secret.
  Storage storage = 1;
}

// RemoveStorageRequest names the storage to remove.
message RemoveStorageRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The storage's name. Required.
  string name = 2;
}

// RemoveStorageResponse is the configuration that was removed.
message RemoveStorageResponse {
  // The storage as it was, without its secret.
  Storage storage = 1;
}

// TestStorageRequest names the storage to test.
message TestStorageRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The storage's name. Required.
  string name = 2;
}

// TestStorageResponse is the outcome of each step of the test.
message TestStorageResponse {
  // Whether every step passed.
  bool passed = 1;

  // One result per step, in the order the steps ran: write, read, compare,
  // remove.
  repeated StorageTestResult results = 2;
}
